let ANSWERS=null;
async function loadAnswers(){if(ANSWERS)return ANSWERS;const r=await fetch("./answers.json",{cache:"no-store"});if(!r.ok)throw new Error("정답 파일을 불러오지 못했습니다.");ANSWERS=await r.json();return ANSWERS;}
const KEY='history-final-50-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};
let mode='home',order=[],at=0,choices={},lastResult=null,reviewWrongOnly=false;
const root=document.getElementById('root');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
let activeName='';
function start(wrong=false){const input=document.getElementById('studentName');const name=(input?.value||activeName||'').trim();if(!name){alert('시험 전 이름을 입력해 주세요.');input?.focus();return;}activeName=name.slice(0,30);localStorage.setItem('twins-name',activeName);let ids=wrong?(saved.wrongIds||[]):DATA.map(x=>x.id);if(!ids.length){alert('복습할 오답이 없습니다.');return;}order=[...ids];at=0;choices={};mode=wrong?'retry':'exam';render();}
function home(){mode='home';render()}
function select(i){choices[order[at]]=i;render()}
function move(d){at=Math.min(order.length-1,Math.max(0,at+d));render()}
async function finish(){const missed=order.filter(id=>choices[id]===undefined);if(missed.length&&!confirm('답하지 않은 문제가 '+missed.length+'개 있습니다. 제출할까요?'))return;try{await loadAnswers()}catch(e){alert('정답 데이터를 불러올 수 없습니다. GitHub Pages 주소에서 접속해 주세요. '+e.message);return;}let count=0,wrong=[];for(let id of order){if(choices[id]===ANSWERS[id].answer)count++;else wrong.push(id)}lastResult={name:activeName,set:'history1',total:order.length,correct:count,wrong,choices:{...choices},ids:[...order],date:new Date().toLocaleString('ko-KR')};saved.last=lastResult;saved.wrongIds=wrong;persist();sendResult(lastResult);mode='result';reviewWrongOnly=true;window.scrollTo(0,0);render()}
let saveMessage='';
async function sendResult(r){try{const cfg=await (await fetch('./recording_config.json',{cache:'no-store'})).json();if(!cfg.endpoint){saveMessage='서버 기록은 아직 미설정입니다. 이 기기에 저장되었습니다.';return;}await fetch(cfg.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:r.name,set:r.set,total:r.total,correct:r.correct,score:Math.round(r.correct/r.total*100),wrongIds:r.wrong,date:new Date().toISOString()})});saveMessage='서버 전송 요청 완료 (실제 수신은 관리자 시트에서 확인 필요)';}catch(e){saveMessage='서버 전송 실패, 이 기기에만 저장되었습니다.';}if(mode==='result')render();}
function card(s){return '<section class="card">'+s+'</section>'}
function render(){if(mode==='home'){let info=saved.last;root.innerHTML=card(`<p><a href="./index.html">← 문제셋 선택</a></p><h2>문제셋 1 · 역사 기본 50문항</h2><label for="studentName"><b>응시자 이름 (필수)</b></label><input id="studentName" maxlength="30" placeholder="이름 또는 별명" autocomplete="name" value="${esc(activeName||localStorage.getItem('twins-name')||'')}" style="display:block;width:100%;padding:14px;margin:8px 0 16px;border:1px solid #aab9ce;border-radius:10px;font-size:17px"><p>50문항의 5지선다 문제를 풀고 자동 채점 후 틀린 문제의 해설만 확인하세요.</p><div class="notice">학습 기록은 <b>현재 기기의 브라우저</b>에만 저장됩니다. 다른 휴대폰과 자동 동기화되지 않으며, 브라우저 데이터 삭제 시 사라질 수 있습니다. 정답 및 해설은 별도 공개 파일로 저장되어 채점 시에만 불러옵니다. GitHub Pages 특성상 완전한 정답 보안은 제공되지 않습니다.</div><p><span class="pill">50문항</span><span class="pill">자동 채점</span><span class="pill">오답 복습</span></p><div class="actions"><button class="btn" onclick="start()">50문항 시험 시작</button>${(saved.wrongIds||[]).length?`<button class="btn secondary" onclick="start(true)">오답만 재시험 (${saved.wrongIds.length})</button>`:''}</div>`)+(info?card(`<h2>이전 성적</h2><div class="stats"><div><strong>${Math.round(info.correct/info.total*100)}</strong>점</div><div><strong>${info.correct}/${info.total}</strong>정답</div><div><strong>${info.wrong.length}</strong>오답</div></div><p class="muted">${esc(info.date)}</p><div class="actions"><button class="btn secondary" onclick="showSaved()">지난 채점·오답 보기</button></div>`):'')+card(`<h2>시험 범위 안내</h2><p>Ⅴ단원 24문항, Ⅵ단원 26문항입니다. 교과서 목차 및 역사 교육과정의 핵심 개념을 바탕으로 제작했으며, 실제 수업 진도나 출제 범위와 완전히 일치하는지는 교과서 원문 및 학교 안내로 추가 확인해야 합니다.</p>`);return;}
if(mode==='exam'||mode==='retry'){let id=order[at],item=DATA.find(x=>x.id===id);root.innerHTML=card(`<div class="eyebrow">${esc(item.unit)} · ${at+1} / ${order.length}</div><div class="progress"><div style="width:${(at+1)/order.length*100}%"></div></div><h2>${at+1}. ${esc(item.question)}</h2>${item.options.map((o,i)=>`<button class="choice ${choices[id]===i?'selected':''}" onclick="select(${i})" aria-pressed="${choices[id]===i}"><b>${i+1}</b><span>${esc(o)}</span></button>`).join('')}<p class="muted">응답 ${Object.keys(choices).length} / ${order.length}</p><div class="actions"><button class="btn secondary" onclick="move(-1)" ${at===0?'disabled':''}>이전</button>${at===order.length-1?'<button class="btn" onclick="finish()">답안 제출·채점</button>':`<button class="btn" onclick="move(1)">다음 문제</button>`}</div>`)+card(`<div class="actions"><button class="btn secondary" onclick="home()">처음으로 (현재 답안은 종료)</button><button class="btn secondary" onclick="finish()">지금 채점</button></div>`);return;}
let r=lastResult||saved.last;if(!r){home();return;}let reviewed=r.wrong;
let unitStats={};for(let id of r.ids){let d=DATA.find(x=>x.id===id),u=d.unit.startsWith('Ⅴ')?'Ⅴ. 조선 사회의 변동':'Ⅵ. 근·현대 사회의 전개';unitStats[u]??={total:0,correct:0};unitStats[u].total++;unitStats[u].correct+=Number(r.choices[id]===ANSWERS[id].answer)}
root.innerHTML=card(`<h2>채점 결과</h2><p class="muted">응시자: ${esc(r.name||activeName||"미입력")} · ${esc(saveMessage||"기기에 결과 저장됨")}</p><div class="stats"><div><strong>${Math.round(r.correct/r.total*100)}</strong>점</div><div><strong>${r.correct}/${r.total}</strong>정답</div><div><strong>${r.wrong.length}</strong>오답</div></div><p class="muted">응시 일시 ${esc(r.date)}</p>${Object.entries(unitStats).map(([k,v])=>`<p style="margin-bottom:5px;font-size:14px">${esc(k)}: ${v.correct}/${v.total}</p><div class="bar"><span style="width:${v.correct/v.total*100}%"></span></div>`).join('')}<p class="actions"><button class="btn" onclick="start()">전체 재시험</button><button class="btn secondary" onclick="start(true)" ${!r.wrong.length?'disabled':''}>오답 재시험</button></p>`)+card(`<h2>오답 해설 (${r.wrong.length}문항)</h2><p class="muted">틀렸거나 답하지 않은 문제만 표시합니다.</p>${reviewed.length?reviewed.map(id=>{let d=DATA.find(x=>x.id===id),given=r.choices[id],ok=given===ANSWERS[id].answer;return `<div class="review"><div class="eyebrow">${esc(d.unit)} · ${id}번</div><p><b>${esc(d.question)}</b></p><div class="${ok?'good':'bad'}"><b>${ok?'정답':'오답'}</b> · 나의 답: ${given===undefined?'미응답':`${given+1}번 ${esc(d.options[given])}`}</div><div class="answerbox"><b>정답: ${ANSWERS[id].answer+1}번 ${esc(d.options[ANSWERS[id].answer])}</b><div>${esc(ANSWERS[id].explanation)}</div></div></div>`}).join(''):'<p>틀린 문제가 없습니다. 훌륭합니다!</p>'}<div class="actions"><button class="btn secondary" onclick="home()">처음 화면</button><button class="btn secondary" onclick="exportWrong()">오답노트 저장</button><button class="btn secondary" onclick="shareWrong()">오답노트 공유</button></div>`);
}
async function showSaved(){try{await loadAnswers()}catch(e){alert("정답 파일을 불러오지 못했습니다. "+e.message);return;}lastResult=saved.last;mode='result';reviewWrongOnly=true;render()}
function exportWrong(){let r=lastResult||saved.last;if(!r)return;let lines=['중3 역사 오답노트',r.date,''];for(let id of r.wrong){let x=DATA.find(z=>z.id===id);lines.push(`${id}. [${x.unit}] ${x.question}`,`정답: ${x.options[ANSWERS[id].answer]}`,`해설: ${ANSWERS[id].explanation}`,'')}const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='history-wrong-notes.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function shareWrong(){let r=lastResult||saved.last;if(!r)return;let lines=['중3 역사 오답노트',r.date,`점수: ${Math.round(r.correct/r.total*100)}점`,''];for(let id of r.wrong){let x=DATA.find(z=>z.id===id),a=ANSWERS[id];lines.push(`${id}. [${x.unit}] ${x.question}`,`내 답: ${r.choices[id]===undefined?'미응답':x.options[r.choices[id]]}`,`정답: ${x.options[a.answer]}`,`해설: ${a.explanation}`,'')}const content=lines.join('\n');if(navigator.share){try{await navigator.share({title:'중3 역사 오답노트',text:content});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(content);alert('오답노트를 클립보드에 복사했습니다.')}catch(e){exportWrong()}}
render();
</script></body></html>
