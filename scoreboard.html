<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>twins_quiz | 점수 순위표</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#eef2f8;color:#1c2c47;margin:0}header{background:#17294a;color:white;padding:23px 16px}header div,main{max-width:820px;margin:auto}h1{font-size:24px;margin:0 0 8px}main{padding:18px 13px 55px}a{color:inherit}header a{color:white}button,select{font:inherit;cursor:pointer;border-radius:9px;padding:11px 14px}select{background:white;border:1px solid #b9c6d8;width:100%;margin-bottom:13px}button{border:0;background:#225cab;color:white;font-weight:700}.switch{display:flex;gap:8px;margin-bottom:14px}.switch button{flex:1;background:#dce7f6;color:#1c477e}.switch button.active{background:#225cab;color:white}.card{background:white;border-radius:15px;padding:17px;margin:15px 0;box-shadow:0 3px 14px #23406b15}.small{color:#697992;font-size:13px;line-height:1.6}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px 6px;border-bottom:1px solid #e5eaf2;font-size:14px}th{color:#576b88;font-size:12px}td:nth-child(1){font-weight:bold;width:43px}td:nth-child(3),th:nth-child(3){text-align:right;font-weight:700}.score{font-size:18px;color:#225cab}.empty{text-align:center;padding:35px 4px;color:#61738b}#refresh{margin-top:8px}</style></head><body><header><div><a href="./index.html">← 문제셋 선택으로</a><h1>시험 점수 순위표</h1><div>최초 점수와 최고 점수를 따로 비교하세요.</div></div></header><main><div class="card"><label for="set"><b>문제셋 선택</b></label><select id="set"><option value="history1">문제셋 1 · 역사 기본</option><option value="history2">문제셋 2 · 역사 내신형</option><option value="tech">문제셋 3 · 기술·가정</option></select><div class="switch"><button id="first" class="active" onclick="switchTab('first')">최초 점수표</button><button id="best" onclick="switchTab('best')">최고 점수표</button></div><p id="description" class="small">학생별 첫 50문항 응시 점수를 유지합니다.</p><button id="refresh" onclick="load()">새로고침</button></div><div class="card"><h2 id="heading">최초 점수 순위</h2><p id="count" class="small"></p><div id="results" class="empty">기록을 불러오는 중입니다.</div></div><p class="small">학생 이름은 일부 가려서 표시됩니다. 같은 이름은 동일 학생으로 간주됩니다. 오답만 재시험한 기록은 제외하며, 두 순위표 모두 50문항 전체 응시만 반영합니다. 점수는 사용자가 전송한 기록이므로 공식 성적을 인증하는 용도는 아닙니다.</p></main><script>
let data=null,tab='first',requestNo=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function switchTab(next){tab=next;$('first').classList.toggle('active',next==='first');$('best').classList.toggle('active',next==='best');$('description').textContent=next==='first'?'학생별 첫 50문항 응시 점수를 유지합니다.':'학생별 가장 높은 50문항 응시 점수로 순위를 정합니다.';render();}
function render(){const id=$('set').value,list=data?.sets?.[id]?.[tab]||[];$('heading').textContent=tab==='first'?'최초 점수 순위':'최고 점수 순위';$('count').textContent='응시 학생 '+(data?.sets?.[id]?.participants??0)+'명';if(!data)return;if(!list.length){$('results').innerHTML='<div class="empty">아직 50문항 전체 응시 기록이 없습니다.</div>';return;}let previous=null,rank=0;$('results').innerHTML='<table><thead><tr><th>순위</th><th>이름 / 응시 횟수</th><th>점수</th></tr></thead><tbody>'+list.map((x,i)=>{if(x.score!==previous){rank=i+1;previous=x.score;}return '<tr><td>'+rank+'</td><td><b>'+esc(x.name)+'</b><div class="small">응시 '+Number(x.attempts)+'회 · '+esc(x.date)+'</div></td><td><span class="score">'+Number(x.score)+'점</span><div class="small">'+Number(x.correct)+'/50</div></td></tr>'}).join('')+'</tbody></table>';}
$('set').onchange=render;
async function load(){const id=++requestNo;data=null;$('results').textContent='서버에서 순위표를 불러오는 중입니다.';try{const cfg=await(await fetch('./recording_config.json',{cache:'no-store'})).json();if(!cfg.endpoint)throw Error('서버 주소가 설정되지 않았습니다.');await new Promise((resolve,reject)=>{const cb='twinsScore'+Date.now();let script=document.createElement('script');let timeout=setTimeout(()=>{delete window[cb];script.remove();reject(Error('응답 시간이 초과되었습니다. Apps Script 재배포를 확인하세요.'));},12000);window[cb]=payload=>{clearTimeout(timeout);delete window[cb];script.remove();if(!payload.ok)reject(Error(payload.error||'조회 실패'));else{data=payload;resolve();}};script.onerror=()=>{clearTimeout(timeout);delete window[cb];script.remove();reject(Error('결과 조회 실패. Apps Script 배포 설정을 확인하세요.'));};script.src=cfg.endpoint+'?callback='+encodeURIComponent(cb)+'&t='+Date.now();document.head.appendChild(script);});if(id===requestNo)render();}catch(e){if(id===requestNo)$('results').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
load();
</script></body></html>
